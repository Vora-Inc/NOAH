name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Scan tracked public files
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          import zlib

          # Exact reviewed public metadata fixtures, never a generic archive exemption.
          fixture = Path("noah/reports/tests/fixtures/synthetic/runtime490-metadata.hex.gz")
          with fixture.open("rb") as handle:
              compressed = handle.read(144897)
          assert len(compressed) == 144896
          assert hashlib.sha256(compressed).hexdigest() == "2fbef3d4b114bfafdef825802a81527c180c6a442b8f367486ff380098d73cd4"
          assert compressed[:10] == bytes.fromhex("1f8b08000000000002ff")
          decoder = zlib.decompressobj(31)
          expanded = decoder.decompress(compressed, 792419)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(expanded) == 792418
          assert hashlib.sha256(expanded).hexdigest() == "36f5b6c6d7ce0d56e3a91582cd7951c4c0c931a9ccb43c9cf8da97777d7ceb3c"
          assert expanded.startswith(b"0x")
          metadata = bytes.fromhex(expanded[2:].decode("ascii"))
          assert len(metadata) == 396208 and metadata.startswith(b"meta")
          assert hashlib.sha256(metadata).hexdigest() == "a76cbe520927d0e232533b84bef160e029b0cd8acf782de458d2d2008500bebc"

          reviewed_fixtures = [fixture]
          for name, size, digest, expanded_size, expanded_digest in (
              ("runtime483-v15.scale.gz", 128359, "64c0d88358a68ef5543ac2da471538bb7736af0b2fd991641ed8f449f2fc399f", 411511, "eb3df3b6d0f2677d96e515d667259ec046cedd6059a4bdfc6848d44f5fd1b15a"),
              ("runtime492-v15.scale.gz", 137407, "994c9b8918188c52844ff85ff2dc56c315352a9b9140e0efb6fbc364f30d45f5", 440461, "a397a753ad67ba335fb02cd5c54ccb0c1149fbf981f3ed6d9df44d49ca5bf71d"),
          ):
              public_fixture = Path("noah/chain/tests/fixtures") / name
              with public_fixture.open("rb") as handle:
                  compressed = handle.read(size + 1)
              assert len(compressed) == size
              assert hashlib.sha256(compressed).hexdigest() == digest
              assert compressed[:10] == bytes.fromhex("1f8b08000000000002ff")
              decoder = zlib.decompressobj(31)
              expanded = decoder.decompress(compressed, expanded_size + 1)
              assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
              assert len(expanded) == expanded_size and expanded.startswith(b"meta\x0f")
              assert hashlib.sha256(expanded).hexdigest() == expanded_digest
              reviewed_fixtures.append(public_fixture)

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          paths = ["./" + path for path in paths if path]
          if not paths:
              raise SystemExit("No tracked files to scan")
          raise SystemExit(subprocess.call([
              sys.executable, "-m", "noah.secret_scan", "--release", "--strict",
              *(part for path in reviewed_fixtures for part in ("--expected-refused", str(path))), *paths
          ]))
          PY
      - name: Install review dependencies
        run: ./scripts/install.sh
      - name: Python, TypeScript, and shared scoring fixtures
        env:
          NOAH_RUNTIME_ROOT: ${{ runner.temp }}/noah-runtime
        run: ./scripts/run-tests.sh
