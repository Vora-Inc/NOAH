name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Scan tracked public files
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          paths = ["./" + path for path in paths if path]
          if not paths:
              raise SystemExit("No tracked files to scan")
          raise SystemExit(subprocess.call([
              sys.executable, "-m", "noah.secret_scan", "--release", "--strict", *paths
          ]))
          PY
      - name: Install review dependencies
        run: ./scripts/install.sh
      - name: Python, TypeScript, and shared scoring fixtures
        env:
          NOAH_RUNTIME_ROOT: ${{ runner.temp }}/noah-runtime
        run: ./scripts/run-tests.sh
