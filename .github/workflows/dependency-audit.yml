name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test fail-closed application policy
        run: python -B -m unittest discover -s .github/security -p 'test_*.py' -v
      - name: Install pinned scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Retain raw Python audits and evaluate exact application scope
        if: always()
        run: python -B .github/security/check_application_vex.py python --output "$RUNNER_TEMP/noah-dependency-audit"
      - name: Independently audit Node even after Python failure
        if: always()
        run: python -B .github/security/check_application_vex.py node --output "$RUNNER_TEMP/noah-dependency-audit"
      - name: Retain raw findings and separate policy decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-evidence
          path: |
            ${{ runner.temp }}/noah-dependency-audit/*.stdout
            ${{ runner.temp }}/noah-dependency-audit/*.stderr
            ${{ runner.temp }}/noah-dependency-audit/*.json
          if-no-files-found: error
